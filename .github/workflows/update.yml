name: Darklords Auto-Update

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:  # manual run button

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch Latest Gift Codes & Data
        run: |
          pip install requests beautifulsoup4
          python - << 'PY'
          import requests, json, re
          from datetime import datetime

          codes = set(["KINGSHOT100K","WELCOME2025","BEARHUNT25","GEN7AVA","KINGDOM777","HERO2026","TG8BOOST","DARKLORDS"])
          
          # Try fetch from known sources
          try:
              r = requests.get("https://heaven-guardian.com/kingshot-gift-codes/", timeout=15, headers={"User-Agent":"Mozilla/5.0"})
              found = re.findall(r'[A-Z0-9]{5,20}', r.text)
              # filter likely codes
              for c in found:
                  if 6 <= len(c) <= 20 and c.isupper():
                      codes.add(c)
          except Exception as e:
              print(f"Source 1 failed: {e}")

          try:
              r = requests.get("https://www.pocketgamer.biz/kingshot-gift-codes/", timeout=15, headers={"User-Agent":"Mozilla/5.0"})
              found = re.findall(r'[A-Z0-9]{5,20}', r.text)
              for c in found:
                  codes.add(c)
          except Exception as e:
              print(f"Source 2 failed: {e}")

          # Save codes.json
          data = {
              "codes": sorted(list(codes))[:30],
              "updated": datetime.utcnow().isoformat() + "Z",
              "count": len(codes),
              "source": "auto-update"
          }
          with open("codes.json","w") as f:
              json.dump(data, f, indent=2)
          
          # Save data.json
          with open("data.json","w") as f:
              json.dump({"tools_updated": datetime.utcnow().isoformat(), "total_tools": 32, "total_guides": 40, "youtube_auto": True, "codes_count": len(codes)}, f, indent=2)

          # Save youtube.json (placeholder for API)
          with open("youtube.json","w") as f:
              json.dump({"updated": datetime.utcnow().isoformat(), "videos":[{"title":"Auto-updated Kingshot Guides","channel":"YouTube Sync"}]}, f, indent=2)

          print(f"Updated {len(codes)} codes")
          PY
      
      - name: Commit changes
        run: |
          git config user.name "Darklords-Bot"
          git config user.email "bot@darklords.github"
          git add codes.json data.json youtube.json || true
          git diff --staged --quiet || git commit -m "Auto-update codes $(date -u)"
          git push || echo "No changes to push"
