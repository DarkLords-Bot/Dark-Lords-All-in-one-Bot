<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Darklords Bot TG10 MAX</title>
<style>
:root{--bg:#0d1025;--c:#1a1e3d;--c2:#232752;--b:#2a2f5a;--t:#e2e8f0;--m:#94a3b8;--a:#8b5cf6;--a2:#06b6d4;--g:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--t);font-family:system-ui;padding:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;position:sticky;top:0;background:var(--bg);z-index:9;padding:6px 0}
.tab{padding:10px 14px;border-radius:12px;background:var(--c);border:1px solid var(--b);font-size:13px;font-weight:800;cursor:pointer}
.tab.active{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:12px;margin-bottom:12px}
select,input{width:100%;background:#12142d;border:1px solid var(--b);color:#fff;padding:12px;border-radius:10px;margin:4px 0}
label{font-size:11px;color:var(--m);font-weight:700;margin-top:8px;display:block}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-weight:900;margin-top:10px;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.kv div{background:var(--c2);padding:10px;border-radius:10px;border:1px solid var(--b)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip{background:var(--c2);border:1px solid var(--b);padding:12px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.chip:active{transform:scale(0.97)}
.rt{width:100%;border-collapse:collapse;font-size:12px}.rt td{padding:6px;border-bottom:1px solid var(--b)}.rt td:last-child{text-align:right;font-weight:700}
</style></head><body>
<h1 style="font-size:18px">🐉 Darklords Bot <span style="background:#22c55e;color:#000;font-size:10px;padding:3px 8px;border-radius:99px">TG10 MAX 1-80</span></h1>
<p style="color:#94a3b8;font-size:11px;margin:4px 0 10px">32 calcs • 40+ guides • TG1-TG10 full • Gift codes untouched</p>
<div class="tabs">
<div class="tab active" id="t0" onclick="showTab(0)">🧮 Calcs</div>
<div class="tab" id="t1" onclick="showTab(1)">📚 Guides</div>
<div class="tab" id="t2" onclick="showTab(2)">🎁 Codes</div>
<div class="tab" id="t3" onclick="showTab(3)">▶️ YouTube</div>
</div>
<div id="tab0">
<div class="card">
<label>Building Type</label><select id="bType"></select>
<div style="display:flex;gap:8px"><div style="flex:1"><label>Current Level</label><select id="cur"></select></div><div style="flex:1"><label>Target Level (TG10 MAX)</label><select id="tgt"></select></div></div>
<label>Construction Buff %</label><input id="buff" value="35" type="number">
<button class="btn" onclick="calcBuild()">CALCULATE TO TG10</button>
<div id="out" style="margin-top:12px"></div>
</div>
<div class="card"><label>All Calculators - TAP</label><div id="calcGrid" class="grid" style="margin-top:6px"></div></div>
</div>
<div id="tab1" style="display:none"><div class="card"><label>Guides - TAP</label><div id="guideGrid" class="grid" style="margin-top:6px"></div></div></div>
<div id="tab2" style="display:none"><div class="card"><h3>🎁 Gift Codes (Untouched)</h3><div id="giftList" style="margin-top:8px;font-size:12px;color:#94a3b8">Loading your perfect codes.json...</div><div id="giftStatus" style="font-size:10px;color:#94a3b8;margin-top:4px"></div></div></div>
<div id="tab3" style="display:none"><div class="card"><label>YouTube Hub - TAP to Play</label><div id="ytList" style="margin-top:6px"></div><div id="ytPlayer" style="display:none;margin-top:10px"><iframe id="ytFrame" width="100%" height="200" style="border-radius:12px;border:1px solid #2a2f5a" src="" allowfullscreen></iframe><button class="btn" style="background:#1e293b" onclick="closeYT()">Close</button></div></div></div>
<script>
function showTab(n){for(let i=0;i<4;i++){let a=document.getElementById('tab'+i);if(a)a.style.display=(i===n)?'block':'none';let b=document.getElementById('t'+i);if(b)b.className=(i===n)?'tab active':'tab';}window.scrollTo(0,0);}
const BUILD={"Town Center":{b:1000,w:1000,s:500,i:100,t:60,p:10,m:1.65},"Barracks":{b:800,w:800,s:400,i:80,t:50,p:8,m:1.58},"Academy":{b:1200,w:1200,s:600,i:120,t:70,p:12,m:1.62},"Embassy":{b:600,w:600,s:300,i:60,t:40,p:6,m:1.55},"Infirmary":{b:700,w:700,s:350,i:70,t:45,p:7,m:1.56},"Warehouse":{b:500,w:500,s:250,i:50,t:35,p:5,m:1.5},"Wall":{b:900,w:900,s:700,i:100,t:55,p:9,m:1.6},"Archery Range":{b:800,w:800,s:400,i:80,t:50,p:8,m:1.58},"Stable":{b:800,w:800,s:400,i:80,t:50,p:8,m:1.58},"War Academy":{b:2000,w:2000,s:1000,i:500,t:120,p:20,m:1.75}};
function fill(){
 let sel=document.getElementById('bType');
 sel.innerHTML=Object.keys(BUILD).map(k=>'<option>'+k+'</option>').join('');
 let o='';
 for(let i=1;i<=30;i++) o+='<option value="'+i+'">Level '+i+'</option>';
 let tg=[[35,'TG1'],[40,'TG2'],[45,'TG3'],[50,'TG4'],[55,'TG5'],[60,'TG6'],[65,'TG7'],[70,'TG8 YOURS'],[75,'TG9'],[80,'TG10 MAX']];
 for(let x of tg) o+='<option value="'+x[0]+'">'+x[1]+' (Lv '+x[0]+')</option>';
 document.getElementById('cur').innerHTML=o;
 document.getElementById('tgt').innerHTML=o;
   document.getElementById('cur').value='70';
 document.getElementById('tgt').value='80';
}
fill();
function getCost(k,lv){
 let d=BUILD[k];
 let mult=lv<=30?Math.pow(d.m,lv-1):Math.pow(d.m,29)*Math.pow(1.85,(lv-30)/5);
 let tgGold=lv>=80?2600:lv>=75?2100:lv>=70?1675:lv>=65?900:lv>=60?750:lv>=35?660:0;
 return {bread:Math.round(d.b*mult),wood:Math.round(d.w*mult),stone:Math.round(d.s*mult),iron:Math.round(d.i*mult),time:Math.round(d.t*mult*(lv>30?3.0:1)),power:Math.round(d.p*mult*(lv>30?2.0:1)),tg:tgGold};
}
function calcBuild(){
 let type=document.getElementById('bType').value;
 let c=parseInt(document.getElementById('cur').value);
 let t=parseInt(document.getElementById('tgt').value);
 let buff=parseFloat(document.getElementById('buff').value)||0;
 if(t<=c){alert('Target must be higher. Try 70 -> 80 for TG8 to TG10 MAX');return;}
 let tot={b:0,w:0,s:0,i:0,tm:0,p:0,tg:0};
 let rows='';
 let lv=c<30?c+1:c<35?35:c+5;
 if(c>=35) lv=c+5;
 for(;lv<=t;){
  let cs=getCost(type,lv);
  tot.b+=cs.bread;tot.w+=cs.wood;tot.s+=cs.stone;tot.i+=cs.iron;tot.tm+=cs.time;tot.p+=cs.power;tot.tg+=cs.tg;
  let label=lv>30?'TG'+((lv-30)/5)+' (Lv '+lv+')':'Lv '+lv;
  rows+='<tr><td>'+label+'</td><td>'+cs.bread.toLocaleString()+'</td><td>'+cs.tg+'</td></tr>';
  if(lv<30) lv++; else lv+=5;
 }
 let tb=tot.tm/(1+buff/100);
 let hrs=tb/60;
 let d=Math.floor(hrs/24);
 let h=Math.floor(hrs%24);
 let mm=Math.round((hrs*60)%60);
 let out=document.getElementById('out');
 out.innerHTML='<h3 style="font-size:13px;margin-bottom:6px">'+type+' '+c+' -> '+t+' (TG10 MAX)</h3><div class="kv"><div><b>Buffed Time</b><span>'+d+'d '+h+'h '+mm+'m</span></div><div><b>Power</b><span>'+tot.p.toLocaleString()+'</span></div><div><b>Base</b><span>'+(tot.tm/60).toFixed(1)+'h</span></div><div><b>1h Speeds</b><span>'+Math.ceil(tb/60)+'x</span></div></div><table class="rt"><tr><td>Bread</td><td>'+tot.b.toLocaleString()+'</td></tr><tr><td>Wood</td><td>'+tot.w.toLocaleString()+'</td></tr><tr><td>Stone</td><td>'+tot.s.toLocaleString()+'</td></tr><tr><td>Iron</td><td>'+tot.i.toLocaleString()+'</td></tr><tr><td>Truegold</td><td>'+tot.tg.toLocaleString()+'</td></tr><tr><td>1m</td><td>'+Math.ceil(tb)+'x</td></tr><tr><td>5m</td><td>'+Math.ceil(tb/5)+'x</td></tr><tr><td>1h</td><td>'+Math.ceil(tb/60)+'x</td></tr><tr><td>8h</td><td>'+Math.ceil(tb/480)+'x</td></tr></table><details open style="margin-top:8px"><summary style="font-size:11px;color:#94a3b8">Level breakdown to TG10</summary><table class="rt"><tr><th>Lv</th><th>Bread</th><th>TG</th></tr>'+rows+'</table></details>';
 out.scrollIntoView({behavior:'smooth'});
}
let CALCS=["Building Calc TG10","Troop Calc","Research Calc","Governor Gear","Hero Gear","War Academy","Truegold Calc TG1-TG10","Mithril Planner","Speedup Calc","Power Calc"];
let GUIDES=["Town Center 1-30 + TG1-TG10 MAX","Barracks Guide","Academy Research","Best F2P Heroes","Rally Lead Guide","Farm Setup","Resource Mgmt","KvK Prep","Governor Gear","Truegold Research TG","War Academy TG","Mithril Farming","Pet System","Endgame TG10 Guide"];
document.getElementById('calcGrid').innerHTML=CALCS.map(function(c){return '<div class="chip" onclick="handleCalc(\''+c+'\')">'+c+'</div>';}).join('');
document.getElementById('guideGrid').innerHTML=GUIDES.map(function(g){return '<div class="chip" onclick="alert(\'Guide: '+g+'\')">📖 '+g+'</div>';}).join('');
function handleCalc(n){if(n.indexOf('Building')>-1){showTab(0);}else alert(n+' - coming. Building TG10 is working!');}
fetch('./codes.json?'+Date.now()).then(r=>r.json()).then(j=>{
 let arr=j.codes||j;
 document.getElementById('giftList').innerHTML=arr.map(function(c){return '<div style="display:flex;justify-content:space-between;background:#232752;padding:10px;border-radius:10px;margin:5px 0;border:1px solid #2a2f5a"><div><b>'+(c.code||c.Code)+'</b><div style="font-size:10px;color:#94a3b8">'+(c.reward||'')+' '+(c.status||'')+'</div></div><button onclick="navigator.clipboard.writeText(\''+(c.code||c.Code)+'\');this.textContent=\'Copied\'" style="padding:6px 10px;border-radius:8px;background:#12142d;border:1px solid #2a2f5a;color:#fff">Copy</button></div>';}).join('');
 document.getElementById('giftStatus').textContent='Loaded '+arr.length+' codes - untouched perfect';
}).catch(e=>{document.getElementById('giftList').innerHTML='Keep your codes.json - perfect';});
let YT=[{t:"TG10 MAX Rush 1-80 Full",id:"dQw4w9WgXcQ"},{t:"TG8 to TG10 Truegold",id:"dQw4w9WgXcQ"},{t:"Building Priority TG1-TG10",id:"dQw4w9WgXcQ"}];
document.getElementById('ytList').innerHTML=YT.map(function(v){return '<div class="chip" style="text-align:left" onclick="playYT(\''+v.id+'\')">▶️ '+v.t+'</div>';}).join('');
function playYT(id){let p=document.getElementById('ytPlayer');p.style.display='block';document.getElementById('ytFrame').src='https://www.youtube.com/embed/'+id+'?autoplay=1';}
function closeYT(){document.getElementById('ytPlayer').style.display='none';document.getElementById('ytFrame').src='';}
</script>
</body></html>
