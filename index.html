<!-- ===== HEADER WITH BLACK DROPDOWN - EXACT LIKE YOUR SCREENSHOT ===== -->
<div style="border:2px solid #111827;border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#fff;position:relative">
<b style="font-size:15px;line-height:1.2">CHOOSE CATEGORY -<br>BUILDING</b>
<button id="mainDropBtn" onclick="toggleDrop()" style="border:2px solid #111827;border-radius:14px;padding:10px 16px;background:#F3F4F6;font-weight:800;display:flex;align-items:center;gap:8px;cursor:pointer">
<span id="dropLabel">🏰 Building</span> <span>⌄</span>
</button>

<!-- BLACK DROPDOWN POPUP - LIKE YOUR SCREENSHOT -->
<div id="dropMenu" style="display:none;position:absolute;top:70px;right:12px;left:12px;background:#1A1D24;border-radius:22px;padding:8px;z-index:999;box-shadow:0 10px 30px rgba(0,0,0,0.3)">
<button onclick="selectMain('building')" id="optBuilding" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 16px;border:0;border-radius:16px;background:#111827;color:#fff;font-weight:900;font-size:18px;cursor:pointer;text-align:left">
<span>🏰 Building</span><span style="width:28px;height:28px;border-radius:50%;border:3px solid #93C5FD;display:flex;align-items:center;justify-content:center"><span style="width:14px;height:14px;background:#93C5FD;border-radius:50%;display:block"></span></span>
</button>
<div style="height:1px;background:#2A2E39;margin:4px 0"></div>
<button onclick="selectMain('gear')" id="optGear" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 16px;border:0;border-radius:16px;background:transparent;color:#fff;font-weight:900;font-size:18px;cursor:pointer;text-align:left">
<span>⚔️ Governor Gear</span><span style="width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:block"></span>
</button>
</div>
</div>

<!-- ===== CONTENT WRAPPER ===== -->
<div id="buildingContent">
<!-- YOUR 1A-1E BUILDING CODES GO HERE - KEEP YOUR EXISTING BUILDING CARDS INSIDE THIS DIV -->
</div>

<div id="gearContent" style="display:none">
<!-- ===== GOVERNOR GEAR CODES INSIDE SAME TAB ===== -->
<div class="card" style="border:2px solid #7C3AED;border-radius:16px;padding:16px;margin-top:14px;background:#fff">
<h2 style="font-size:14px;font-weight:900">DIVISION 2 - Governor Gear Calculator</h2>
<p style="font-size:11px;color:#6B7280;margin:8px 0">Real game data</p>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
<div style="border:1px solid #E5E7EB;border-radius:12px;padding:12px">
<b style="font-size:12px">Headgear</b>
<div style="display:flex;gap:8px;margin-top:8px">
<select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Current Level</option><option>1</option><option>10</option><option>50</option></select>
<select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Target Level</option></select>
</div>
</div>
<div style="border:1px solid #E5E7EB;border-radius:12px;padding:12px">
<b style="font-size:12px">Armor</b>
<div style="display:flex;gap:8px;margin-top:8px">
<select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Current</option></select>
<select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Target</option></select>
</div>
</div>
<div style="border:1px solid #E5E7EB;border-radius:12px;padding:12px"><b style="font-size:12px">Legs</b><div style="display:flex;gap:8px;margin-top:8px"><select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Current</option></select><select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Target</option></select></div></div>
<div style="border:1px solid #E5E7EB;border-radius:12px;padding:12px"><b style="font-size:12px">Staff</b><div style="display:flex;gap:8px;margin-top:8px"><select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Current</option></select><select style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><option>Target</option></select></div></div>
</div>

<button style="width:100%;margin-top:12px;padding:12px;border-radius:12px;background:#7C3AED;color:#fff;font-weight:900;border:0">CALCULATE GEAR 2A</button>
</div>

<!-- 2B, 2C, 2D, 2E INSIDE SAME TAB -->
<div class="card" style="border:1px solid #E5E7EB;border-radius:16px;padding:16px;margin-top:12px"><h3>DIVISION 2B - Inventory</h3><div style="display:flex;gap:10px;margin-top:10px"><div style="flex:1"><span style="font-size:10px;font-weight:800">SATIN</span><input type="number" style="width:100%;padding:10px;border-radius:10px;border:1px solid #E5E7EB;margin-top:4px"></div><div style="flex:1"><span style="font-size:10px;font-weight:800">GILDED</span><input type="number" style="width:100%;padding:10px;border-radius:10px;border:1px solid #E5E7EB;margin-top:4px"></div></div></div>

<div class="card" style="border:2px solid #111827;border-radius:16px;padding:16px"><h3>DIVISION 2C - FINAL PLAN & EXPORT</h3><div style="background:#111827;border-radius:12px;padding:14px;margin-top:10px"><b style="color:#fff;font-size:12px">📋 COPY-PASTE GEAR PLAN</b><textarea style="width:100%;height:100px;background:#1F2937;color:#CBD5E1;margin-top:8px;border-radius:10px;border:0;padding:10px" readonly>Waiting for 2A...</textarea></div></div>

<div class="card" style="border:2px dashed #7C3AED;border-radius:16px;padding:16px"><h3 style="text-align:center">DIVISION 2E - YouTube Gear (Locked to Gear Only)</h3><div style="border:2px solid #7C3AED;border-radius:12px;padding:12px;background:#F5F3FF;margin-top:10px"><b style="font-size:10px;color:#7C3AED">🟣 GEAR ONLY SEARCH</b><div style="display:flex;gap:6px;margin-top:6px"><input id="ytGearTab" placeholder="Satin, Head, Vision" style="flex:1;padding:10px;border-radius:10px;border:1px solid #E5E7EB"><button onclick="var q=document.getElementById('ytGearTab').value;if(!q)return alert('Type gear');window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('kingshot governor gear upgrade '+q),'_blank')" style="padding:10px;background:#7C3AED;color:#fff;border:0;border-radius:10px;font-weight:900">Search</button></div></div></div>
</div>

<script>
function toggleDrop(){
 var m=document.getElementById('dropMenu');
 m.style.display = m.style.display==='none'||m.style.display==='' ? 'block':'none';
}
function selectMain(type){
 var label=document.getElementById('dropLabel');
 var bContent=document.getElementById('buildingContent');
 var gContent=document.getElementById('gearContent');
 var bOpt=document.getElementById('optBuilding');
 var gOpt=document.getElementById('optGear');
 document.getElementById('dropMenu').style.display='none';
 if(type==='building'){
   label.textContent='🏰 Building';
   bContent.style.display='block';
   gContent.style.display='none';
   bOpt.style.background='#111827';
   bOpt.innerHTML='<span>🏰 Building</span><span style="width:28px;height:28px;border-radius:50%;border:3px solid #93C5FD;display:flex;align-items:center;justify-content:center"><span style="width:14px;height:14px;background:#93C5FD;border-radius:50%;display:block"></span></span>';
   gOpt.style.background='transparent';
   gOpt.innerHTML='<span>⚔️ Governor Gear</span><span style="width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:block"></span>';
 }else{
   label.textContent='⚔️ Governor Gear';
   bContent.style.display='none';
   gContent.style.display='block';
   gOpt.style.background='#111827';
   gOpt.innerHTML='<span>⚔️ Governor Gear</span><span style="width:28px;height:28px;border-radius:50%;border:3px solid #93C5FD;display:flex;align-items:center;justify-content:center"><span style="width:14px;height:14px;background:#93C5FD;border-radius:50%;display:block"></span></span>';
   bOpt.style.background='transparent';
   bOpt.innerHTML='<span>🏰 Building</span><span style="width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:block"></span>';
 }
}
// close dropdown when clicking outside
document.addEventListener('click',function(e){
 if(!e.target.closest('#mainDropBtn') && !e.target.closest('#dropMenu')){
   document.getElementById('dropMenu').style.display='none';
 }
});
</script>
